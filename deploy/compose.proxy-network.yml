services:
  web:
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${PROXY_NETWORK}
      traefik.http.routers.luxengine-web.rule: Host(`luxengine.io`) || Host(`www.luxengine.io`)
      traefik.http.routers.luxengine-web.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.luxengine-web.tls: "true"
      traefik.http.routers.luxengine-web.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.services.luxengine-web.loadbalancer.server.port: "3000"
    networks:
      default: {}
      edge:
        aliases:
          - luxengine-web

  proxy:
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${PROXY_NETWORK}
      traefik.http.routers.luxengine-proxy.rule: Host(`proxy.luxengine.io`)
      traefik.http.routers.luxengine-proxy.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.luxengine-proxy.tls: "true"
      traefik.http.routers.luxengine-proxy.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.services.luxengine-proxy.loadbalancer.server.port: "8082"
    networks:
      default: {}
      edge:
        aliases:
          - luxengine-proxy

networks:
  default: {}
  edge:
    external: true
    name: ${PROXY_NETWORK:?set in /etc/luxengine/proxy-network.env}
