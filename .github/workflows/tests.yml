name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 1

      - name: "Fail on type: ignore (no suppressions allowed)"
        run: |
          if grep -rE '# type: ignore|# ty: ignore' --include='*.py' . --exclude-dir=.venv --exclude-dir=.git; then
            echo "::error::type: ignore / ty: ignore comments are not allowed. Fix the underlying type errors instead."
            exit 1
          fi
          exit 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.4"
          enable-cache: true
          cache-python: true

      - name: Format check
        run: uv run ruff format --check

      - name: Style check
        run: uv run ruff check

      - name: Type check
        run: uv run ty check

      - name: Run tests
        run: uv run pytest -v --tb=short

  web-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktcGxhY2Vob2xkZXIuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_ci-placeholder
      LUXENGINE_PLATFORM_HOSTS: luxengine.io,www.luxengine.io
      NEXT_PUBLIC_CANONICAL_HOST: luxengine.io
    defaults:
      run:
        working-directory: lux-engine
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lux-engine/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Block critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

  container-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktcGxhY2Vob2xkZXIuZXhhbXBsZS5jb20k
      NEXT_PUBLIC_CANONICAL_HOST: luxengine.io
      WEB_ENV_FILE: /dev/null
      PROXY_ENV_FILE: /dev/null
      PROXY_NETWORK: luxengine-edge
      TRAEFIK_CERTRESOLVER: mytlschallenge
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 1

      - name: Validate Docker Compose
        run: |
          docker compose --file deploy/compose.yml config --quiet
          docker compose \
            --file deploy/compose.yml \
            --file deploy/compose.proxy-network.yml \
            config --quiet

      - name: Build web image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_CONVEX_URL \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY \
            --build-arg NEXT_PUBLIC_CANONICAL_HOST \
            --tag luxengine-web:ci \
            lux-engine

      - name: Build proxy image
        run: docker build --tag luxengine-proxy:ci .
